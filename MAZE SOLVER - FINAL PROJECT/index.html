<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Solver - BFS Algorithm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: 600;
            color: #333;
            font-size: 0.95em;
        }

        input[type="number"], select, button {
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 0.95em;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .canvas-container {
            background: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            overflow-x: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        canvas {
            border: 2px solid #333;
            display: block;
            background: white;
        }

        .info-section {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .info-section h3 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 1em;
        }

        .info-section p {
            color: #555;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .legend {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
        }

        .legend-color {
            width: 25px;
            height: 25px;
            border: 1px solid #999;
            border-radius: 3px;
        }

        .color-path { background: white; }
        .color-wall { background: #333; }
        .color-start { background: #4CAF50; }
        .color-end { background: #FF5252; }
        .color-solution { background: #FFD700; }
        .color-visited { background: #90CAF9; }

        .result-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-section.success {
            background: #e8f5e9;
            border-left: 4px solid #4CAF50;
        }

        .result-section.error {
            background: #ffebee;
            border-left: 4px solid #FF5252;
        }

        .result-text {
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1em;
        }

        .result-section.success .result-text {
            color: #2e7d32;
        }

        .result-section.error .result-text {
            color: #c62828;
        }

        .path-display {
            background: white;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            color: #333;
            overflow-x: auto;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .canvas-container {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Maze Solver</h1>
        <p class="subtitle">BFS Algorithm Visualization</p>

        <div class="info-section">
            <h3>How to Use:</h3>
            <p>1. Set maze dimensions (rows × columns)<br>
               2. Create a maze or load an example<br>
               3. Set start and end positions<br>
               4. Click "Solve Maze" to find the shortest path</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="rows">Rows:</label>
                <input type="number" id="rows" min="3" max="20" value="8">
            </div>
            <div class="control-group">
                <label for="cols">Columns:</label>
                <input type="number" id="cols" min="3" max="20" value="8">
            </div>
            <div class="control-group">
                <label for="startRow">Start Row:</label>
                <input type="number" id="startRow" min="0" value="0">
            </div>
            <div class="control-group">
                <label for="startCol">Start Col:</label>
                <input type="number" id="startCol" min="0" value="0">
            </div>
            <div class="control-group">
                <label for="endRow">End Row:</label>
                <input type="number" id="endRow" min="0" value="7">
            </div>
            <div class="control-group">
                <label for="endCol">End Col:</label>
                <input type="number" id="endCol" min="0" value="7">
            </div>
            <div class="control-group">
                <label>&nbsp;</label>
                <button onclick="loadExample()">Load Example</button>
            </div>
            <div class="control-group">
                <label>&nbsp;</label>
                <button onclick="randomMaze()">Random Maze</button>
            </div>
        </div>

        <div class="button-group">
            <button onclick="createMaze()" style="grid-column: 1;">Create Maze</button>
            <button onclick="solveMaze()" style="grid-column: 2;">Solve Maze</button>
        </div>

        <div class="canvas-container">
            <canvas id="mazeCanvas" width="400" height="400"></canvas>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color color-path"></div>
                <span>Path</span>
            </div>
            <div class="legend-item">
                <div class="legend-color color-wall"></div>
                <span>Wall</span>
            </div>
            <div class="legend-item">
                <div class="legend-color color-start"></div>
                <span>Start</span>
            </div>
            <div class="legend-item">
                <div class="legend-color color-end"></div>
                <span>End</span>
            </div>
            <div class="legend-item">
                <div class="legend-color color-visited"></div>
                <span>Visited</span>
            </div>
            <div class="legend-item">
                <div class="legend-color color-solution"></div>
                <span>Solution</span>
            </div>
        </div>

        <div id="resultSection" class="result-section">
            <div class="result-text" id="resultText"></div>
            <div class="path-display" id="pathDisplay" style="display: none;"></div>
        </div>
    </div>

    <script src="maze.js"></script>
</body>
</html>
